name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  STRAPI_TELEMETRY_DISABLED: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build (standalone, as in the Docker image)
        # No Strapi in CI: pages are prerendered with empty data, exactly like a cold first deploy.
        run: npm run build
        env:
          BUILD_STANDALONE: "1"
          NEXT_PUBLIC_SITE_URL: https://uswat.edu.pk
          NEXT_PUBLIC_STRAPI_URL: https://cms.uswat.edu.pk
          STRAPI_URL: http://127.0.0.1:1
      - name: Check the standalone server was produced
        run: test -f .next/standalone/server.js

  cms:
    name: CMS (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generate Strapi types (types/generated is not committed)
        # Placeholder settings only: type generation reads the schemas and never connects to a database.
        run: npm run typegen
        env:
          DATABASE_CLIENT: postgres
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 1
          APP_KEYS: ci-only
          ADMIN_JWT_SECRET: ci-only
          API_TOKEN_SALT: ci-only
          TRANSFER_TOKEN_SALT: ci-only
          JWT_SECRET: ci-only
          ENCRYPTION_KEY: ci-only
      - name: Typecheck
        run: npm run typecheck
      - name: Build (server + admin panel)
        run: npm run build
        env:
          NODE_ENV: production

  docker:
    name: Docker images
    needs: [frontend, cms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: |
          # Dummy values only; real secrets live in .env on the server.
          sed -E 's/^([A-Z_]+)=$/\1=ci-dummy-value/' .env.example > .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet
          rm .env

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: uswat-frontend:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://uswat.edu.pk
            NEXT_PUBLIC_STRAPI_URL=https://cms.uswat.edu.pk
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build CMS image
        uses: docker/build-push-action@v6
        with:
          context: cms
          target: runner
          push: false
          tags: uswat-cms:ci
          cache-from: type=gha,scope=cms
          cache-to: type=gha,scope=cms,mode=max

      - name: Build Nginx image
        uses: docker/build-push-action@v6
        with:
          context: nginx
          push: false
          load: true
          tags: uswat-nginx:ci
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

      - name: Test the Nginx configuration (nginx -t)
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=ci.invalid" \
            -keyout /tmp/certs/origin.key -out /tmp/certs/origin.pem
          # Stand-ins so the upstream names "frontend" and "cms" resolve on the Docker network.
          docker network create ci-net
          docker run -d --rm --name frontend --network ci-net alpine:3.22 sleep 120
          docker run -d --rm --name cms --network ci-net alpine:3.22 sleep 120
          docker run --rm --network ci-net -v /tmp/certs:/etc/nginx/certs:ro uswat-nginx:ci nginx -t
