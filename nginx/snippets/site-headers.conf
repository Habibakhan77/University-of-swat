# Headers for the public website (Next.js).
include /etc/nginx/snippets/security-headers.conf;
add_header X-Frame-Options "DENY" always;
# Next.js streams its page data in inline <script> tags, and the pages are prerendered and cached
# (no per-request nonce), so scripts need 'unsafe-inline'; everything else is locked to this site.
# Images go through /_next/image ('self'); Strapi media links point at cms.<this host>.
# frame-src: the contact page's Google Map, loaded only when the visitor asks for it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cms.$host; font-src 'self' data:; connect-src 'self'; media-src 'self' https://cms.$host; frame-src https://maps.google.com https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
