# Response headers for the Strapi admin panel served at <domain>/admin (nginx.conf).
# Nginx sets these once for every response; drop Strapi's copies to avoid duplicates. Strapi keeps its own
# Content-Security-Policy for the admin (the website's stricter CSP in site-headers.conf would break it).
proxy_hide_header X-Powered-By;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Cross-Origin-Opener-Policy;
include /etc/nginx/snippets/security-headers.conf;
add_header X-Frame-Options "SAMEORIGIN" always;
