# University of Swat: Nginx reverse proxy
#
#   https://<domain>          -> frontend:3000  (Next.js website, English + /ur)
#   https://www.<domain>      -> 301 to https://<domain>
#   https://cms.<domain>      -> cms:1337       (Strapi admin panel, REST API, /uploads media)
#
# The config is domain-agnostic: it works unchanged for uswat.edu.pk or a staging domain.
# TLS is a Cloudflare Origin Certificate (covers <domain> and *.<domain>) mounted at
# /etc/nginx/certs; Cloudflare's SSL mode must be "Full (strict)". See DEPLOY.md.

user nginx;
worker_processes auto;
pid /run/nginx.pid;
pcre_jit on;
error_log /var/log/nginx/error.log warn;

# Alpine's module packages drop a load_module line here (Brotli filter + static).
include /etc/nginx/modules/*.conf;

events {
    worker_connections 2048;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65s;
    server_tokens     off;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    # Public website: forms and search only; Strapi raises its own limit below.
    client_max_body_size 1m;
    client_body_timeout  30s;
    client_header_timeout 15s;

    # Docker's internal DNS, so container restarts (new IPs) are picked up.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Real visitor IP from Cloudflare (needed for logs and rate limits).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # ---------- Compression ----------
    # Cloudflare compresses for visitors too; this covers Cloudflare<->origin and direct access.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/ld+json application/manifest+json application/xml application/rss+xml
               application/atom+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/json
                 application/ld+json application/manifest+json application/xml application/rss+xml
                 application/atom+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # ---------- Rate limits ----------
    # Only POSTs count (contact form server action, logins); normal browsing is never limited.
    map $request_method $post_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $post_limit_key     zone=site_post:10m  rate=10r/m;
    limit_req_zone $post_limit_key     zone=cms_login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=cms_api:10m    rate=20r/s;
    limit_req_status 429;

    # next/image picks AVIF, WebP or the original from the Accept header; cache one copy per format.
    map $http_accept $image_format {
        ~*image/avif avif;
        ~*image/webp webp;
        default      other;
    }

    # ---------- Edge cache for optimised images and media ----------
    proxy_cache_path /var/cache/nginx/next_image levels=1:2 keys_zone=next_image:20m max_size=2g
                     inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/uploads    levels=1:2 keys_zone=uploads:20m    max_size=5g
                     inactive=30d use_temp_path=off;

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
        keepalive 32;
    }

    upstream cms {
        zone cms 64k;
        server cms:1337 resolve;
        keepalive 16;
    }

    # ---------- Port 80: health check, everything else to HTTPS ----------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- Shared TLS settings ----------
    ssl_certificate         /etc/nginx/certs/origin.pem;
    ssl_certificate_key     /etc/nginx/certs/origin.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # ---------- www.<domain> -> <domain> ----------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ~^www\.(?<apex>.+)$;
        include /etc/nginx/snippets/security-headers.conf;
        return 301 https://$apex$request_uri;
    }

    # ---------- cms.<domain>: Strapi admin, API and media ----------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name cms.*;

        # Staff upload PDFs, photos and videos in the Media Library.
        client_max_body_size 50m;
        client_body_timeout  120s;

        include /etc/nginx/snippets/proxy.conf;
        # Nginx sets these once for every response; drop Strapi's copies to avoid duplicates.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;

        # Uploaded media: file names carry a hash, so long caching is safe.
        location /uploads/ {
            proxy_pass http://cms;
            proxy_cache uploads;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Cache-Control;
            include /etc/nginx/snippets/security-headers.conf;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # The contact form is posted by the website server over the internal network (http://cms:1337).
        # From the internet the endpoint is not needed, so it is closed here as a second layer.
        location ^~ /api/contact-messages {
            return 404;
        }

        # Brute-force protection for admin and API sign-in.
        location ~ ^/(admin/login|admin/register-admin|admin/forgot-password|api/auth/) {
            limit_req zone=cms_login burst=5 nodelay;
            proxy_pass http://cms;
            include /etc/nginx/snippets/security-headers.conf;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location /api/ {
            limit_req zone=cms_api burst=40 nodelay;
            proxy_pass http://cms;
            include /etc/nginx/snippets/security-headers.conf;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Admin panel (its own Content-Security-Policy comes from Strapi's security middleware).
        location / {
            proxy_pass http://cms;
            include /etc/nginx/snippets/security-headers.conf;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }

    # ---------- <domain>: the website ----------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        include /etc/nginx/snippets/proxy.conf;
        proxy_hide_header X-Powered-By;

        # Hashed JS/CSS/fonts: Next.js already sends "immutable, max-age=1 year".
        location /_next/static/ {
            proxy_pass http://frontend;
            include /etc/nginx/snippets/site-headers.conf;
        }

        # next/image output (AVIF/WebP): cached here so each size is produced only once.
        location /_next/image {
            proxy_pass http://frontend;
            proxy_cache next_image;
            proxy_cache_key "$scheme$host$request_uri|$image_format";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 400 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_hide_header Cache-Control;
            include /etc/nginx/snippets/site-headers.conf;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Files from frontend/public and app icons (not content-hashed, so 7 days rather than a year).
        location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
            proxy_pass http://frontend;
            proxy_hide_header Cache-Control;
            include /etc/nginx/snippets/site-headers.conf;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        }

        # Called only by Strapi over the internal network (http://frontend:3000); never from outside.
        location = /api/revalidate {
            return 404;
        }

        # Pages (HTML is never cached here: on-demand revalidation keeps it fresh in Next.js).
        location / {
            limit_req zone=site_post burst=5 nodelay;
            proxy_pass http://frontend;
            include /etc/nginx/snippets/site-headers.conf;
        }
    }
}
